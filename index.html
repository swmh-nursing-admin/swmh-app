<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#00843d">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>SWMH Daily Nursmid Monitoring</title>
<style>
:root{--g:#0b8a4b;--gd:#065f35;--ink:#10304a;--mu:#6b8494;--or:#f26b21}
*{box-sizing:border-box}
body{margin:0;font-family:Poppins,"Segoe UI",Roboto,Arial,sans-serif;background:#eef5f1;color:var(--ink);-webkit-text-size-adjust:100%}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px 14px;color:#fff;text-align:center;background:linear-gradient(165deg,#054d2c,#0b8a4b 60%,#17b26a);padding:max(22px,env(safe-area-inset-top)) 16px 66px;border-radius:0 0 46px 46px;position:relative;overflow:hidden}
header:before,header:after{content:"";position:absolute;border-radius:50%;background:#ffffff14}
header:before{width:230px;height:230px;right:-60px;top:-90px}header:after{width:140px;height:140px;left:-40px;bottom:-60px}
header img{height:84px;background:#fff;border-radius:50%;padding:5px;box-shadow:0 8px 20px #0003;position:relative;z-index:1}
.ht{position:relative;z-index:1;flex-basis:100%}.ht h1{font-size:19px;margin:0}.ht p{margin:4px 0 0;font-size:11px;letter-spacing:.8px;opacity:.9}
#st{flex-basis:100%;font-size:11px;opacity:.92;position:relative;z-index:1}
body.in header{flex-wrap:nowrap;justify-content:flex-start;text-align:left;padding:12px 14px;border-radius:0 0 24px 24px}
body.in header img{height:40px;padding:2px}body.in .ht{flex-basis:auto}body.in .ht h1{font-size:13px}body.in .ht p{display:none}
body.in #st{flex-basis:auto;margin-left:auto;background:#ffffff26;padding:4px 10px;border-radius:99px;max-width:50%;font-size:10px}
main{max-width:1100px;margin:auto;padding:14px 12px 120px}body.out main{margin-top:-46px;position:relative;z-index:2}
.card{background:#fff;border-radius:24px;padding:18px;margin-bottom:14px;box-shadow:0 8px 26px #10304a14}
h2{margin:0 0 8px;color:var(--ink);font-size:21px}h3{margin:16px 0 8px;color:var(--gd);font-size:16px}.rt{margin:20px 6px 10px}
button{border:0;border-radius:16px;padding:12px 18px;font:600 14px Poppins,"Segoe UI",Roboto,Arial,sans-serif;cursor:pointer;background:linear-gradient(135deg,#0b8a4b,#17b26a);color:#fff;box-shadow:0 6px 14px #0b8a4b40;margin:3px}
button.s{background:#fff;color:var(--gd);border:1.5px solid #cfe6da;box-shadow:none}button:active{transform:scale(.97)}
.cta{display:block;width:100%;padding:16px;border-radius:999px;background:linear-gradient(135deg,#f26b21,#ff9a3c);letter-spacing:1.2px;font-size:15px;box-shadow:0 10px 22px #f26b2155;margin:12px 0 6px}
input,select,textarea{width:100%;padding:14px 18px;border:1.5px solid #d3e3da;border-radius:999px;font:15px Poppins,"Segoe UI",Roboto,Arial,sans-serif;margin:4px 0 12px;background:#f9fcfa;color:var(--ink)}
textarea{border-radius:20px;min-height:84px}input:focus,select:focus,textarea:focus{outline:none;border-color:var(--g);box-shadow:0 0 0 4px #0b8a4b22}
label{font-weight:600;font-size:13px;color:var(--gd);margin-left:6px}.m{font-size:12px;color:var(--mu)}
.pw{position:relative}.pw input{padding-right:84px}.pw button{position:absolute;right:6px;top:9px;margin:0;padding:8px 13px;font-size:12px;border-radius:999px}
.auth{display:grid;gap:14px;max-width:980px;margin:0 auto}@media(min-width:860px){.auth{grid-template-columns:1.1fr 1fr;align-items:start}}
.aph{border-radius:26px;overflow:hidden;border:5px solid #fff;box-shadow:0 12px 32px #10304a26}.aph img,.hero{display:block;width:100%;height:auto}
.sw{text-align:center;font-size:13px;margin:10px 0 0}.sw a{color:var(--or);font-weight:700;cursor:pointer}
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:max(10px,env(safe-area-inset-bottom));width:min(600px,calc(100% - 16px));z-index:20;display:flex;justify-content:space-around;align-items:flex-end;background:#fff;border-radius:28px;padding:8px 6px;box-shadow:0 12px 34px #10304a3d}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;background:none;box-shadow:none;color:var(--mu);font-size:10px;padding:6px 0;margin:0 2px;border-radius:18px}
.tabs button i{font-style:normal;font-size:21px}.tabs button.on{background:#e4f6ec;color:var(--gd)}
.tabs .plus{background:none!important;color:var(--or)!important}.tabs .plus b{display:grid;place-items:center;width:56px;height:56px;border-radius:50%;margin-top:-34px;background:linear-gradient(135deg,#f26b21,#ff9a3c);color:#fff;font-size:30px;border:4px solid #fff;box-shadow:0 10px 20px #f26b2166}
.hero2{border-radius:28px;padding:18px;margin-bottom:14px;color:#fff;background:linear-gradient(150deg,#054d2c,#0b8a4b 55%,#14b8a6);box-shadow:0 14px 30px #0b8a4b40}
.hh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.hh p{margin:0;font-size:13px;opacity:.92}.hh h1{margin:2px 0 6px;font-size:40px;line-height:1.1}
.av{flex:none;width:48px;height:48px;border-radius:50%;background:#ffffff33;display:grid;place-items:center;font-weight:700;font-size:20px;cursor:pointer;border:2px solid #fff6}
.ar{display:block;width:100%;height:84px;margin:8px 0}.hm{font-size:12px;opacity:.85;margin:8px 0 4px}
.qs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}.qs.q3{grid-template-columns:repeat(3,1fr)}
.qs div{background:#ffffff1f;border-radius:16px;padding:10px 4px;text-align:center}.qs i{font-style:normal;font-size:20px;display:block}.qs b{display:block;font-size:17px}.qs span{font-size:10px;opacity:.9}
.wk{display:flex;gap:6px;margin:4px 0 8px}.dc{flex:1;text-align:center;background:#ffffff1f;border-radius:16px;padding:8px 0}.dc small{display:block;font-size:10px;opacity:.85}.dc b{font-size:16px}.dc u{display:block;text-decoration:none;font-size:10px;height:13px}
.dc.on{background:#fff;color:var(--gd)}.dc.has u{color:#ffd166;font-weight:700}.dc.on.has u{color:var(--or)}
.rgs{display:flex;gap:10px;justify-content:space-around;flex-wrap:wrap}.rg{text-align:center;width:104px}.rg svg{width:100%}.rg span{font-size:11px;color:var(--mu);font-weight:600}
.vb{display:flex;gap:4px;align-items:stretch;height:180px}.vc{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}.vt{flex:1;width:100%;display:flex;align-items:flex-end;background:#eef5f1;border-radius:9px;overflow:hidden}.vt>div{width:100%;border-radius:9px 9px 0 0}.vc i{font-style:normal;font-size:13px}
.ur{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:20px;margin:8px 0;background:var(--t)}.ur .ut{flex:0 0 200px}.pb{flex:1;min-width:0}
.ui{flex:none;position:relative;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:24px;font-style:normal;background:var(--gr);box-shadow:inset 0 0 0 3px #fff,0 3px 8px #10304a1f}
.ui b{position:absolute;right:-4px;bottom:-4px;width:21px;height:21px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:11px;box-shadow:0 1px 5px #0003}
.ut{display:inline-flex;align-items:center;gap:10px;font-weight:600;font-size:13px;line-height:1.2}.ut small{display:block;color:var(--mu);font-weight:500;font-size:11px}
.utg{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:10px}
.utile{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12px 6px;margin:0;border-radius:22px;background:#fff;color:var(--ink);border:2px solid #e1eee6;box-shadow:none}
.utile .ut{flex-direction:column;gap:7px;font-size:12px}.utile .ui{width:62px;height:62px;font-size:32px}.utile.on{border-color:var(--or);background:#fff4ec;box-shadow:0 0 0 3px #f26b2133}
.sec{display:flex;align-items:center;gap:10px;margin:22px 0 8px}.sec i{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:19px}
.item{background:#f7fbf9;border:1px solid #e1efe7;border-radius:20px;padding:12px;margin:8px 0;font-size:14px}.di{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sc{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:8px 0 4px}
.sc button{margin:0;padding:12px 0;background:#fff;color:var(--ink);border:2px solid #d8e8df;box-shadow:none;border-radius:999px;font-size:16px}.sc button.sel{color:#fff;border-color:transparent}
.sc .n0.sel,.v0{background:#e5484d}.sc .n1.sel,.v1{background:#fb8c2a}.sc .n2.sel,.v2{background:#e5a400}.sc .n3.sel,.v3{background:#14b8a6}.sc .n4.sel,.v4{background:#2f80ed}.sc .n5.sel,.v5{background:#0b8a4b}
.sv{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff}.dh{display:flex;align-items:center;gap:12px}.dh>div:nth-child(2){flex:1}.dh .rg{width:84px}
.prog{position:sticky;top:8px;z-index:6;background:#fff;border-radius:18px;padding:10px 14px;margin-bottom:12px;box-shadow:0 8px 20px #10304a26;font-size:12px;font-weight:600;color:var(--gd)}
.bar{height:10px;border-radius:99px;background:#e3efe8;overflow:hidden;margin:4px 0}.bar>div{height:100%;border-radius:99px;transition:width .4s}
.p{display:inline-block;padding:3px 11px;border-radius:999px;font-size:12px;font-weight:700;color:#fff;white-space:nowrap}
.g{background:#0b8a4b}.a{background:#f59e0b}.r{background:#e5484d}.pend{background:#94a3b8}
.recs{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
.rec{background:#fff;border-radius:22px;padding:14px;box-shadow:0 8px 22px #10304a14;border-left:7px solid var(--k);display:flex;flex-direction:column;gap:8px}
.rh{display:flex;justify-content:space-between;align-items:center;gap:8px}.rf{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{background:#f4faf7;border:1px solid #e0eee6;border-radius:999px;padding:5px 12px 5px 6px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.stat{border-radius:22px;padding:14px;color:#fff;font-size:13px;font-weight:600;background:linear-gradient(135deg,#0b8a4b,#27c47d)}.stat i{font-style:normal;font-size:22px;display:block}.stat b{display:block;font-size:26px}
.grid>.stat:nth-child(4n+2){background:linear-gradient(135deg,#2f80ed,#5aa2ff)}.grid>.stat:nth-child(4n+3){background:linear-gradient(135deg,#fb8c2a,#ffb35c)}.grid>.stat:nth-child(4n+4){background:linear-gradient(135deg,#7c5cff,#a58bff)}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px 8px;border-bottom:1px solid #e6f0ea;text-align:left;vertical-align:middle}th{background:#eaf6ef;color:var(--gd)}.wrap{overflow-x:auto}
#toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#10304a;color:#fff;padding:12px 18px;border-radius:16px;display:none;z-index:30;max-width:90%}
.fab{display:none!important}.warn{background:#fff3cd;border:1px solid #f0c36d;padding:10px;border-radius:12px;margin-bottom:10px;font-size:14px}
@media(max-width:560px){main{padding:12px 10px 120px}.card{padding:14px}.hh h1{font-size:34px}.ur{flex-wrap:wrap}.ur .ut{flex:1 1 100%}.recs{grid-template-columns:1fr}.ht h1{font-size:16px}.rg{width:92px}}
@media print{header,.tabs,.noprint,.prog,#toast{display:none!important}body{background:#fff}main{padding:0}.card{box-shadow:none;padding:0}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}

</style></head><body>

function renderAuth(){$("fab").style.display="none";document.body.className="out";const L=mode==="login";
  $("app").innerHTML=`<div class="auth"><div class="aph"><img class="hero" alt="SWMH nursing team" src="${PHOTO}"></div><div class="card af"><h2>${L?"Welcome back 👋":"Create account"}</h2><p class="m">${L?"Log in to your account":"Register as an Assessor or Nurse Manager"}</p>
  ${!L?`<label>Full name</label><input id="nm" placeholder="Your full name"><label>Role</label><select id="rl" onchange="$('mc').style.display=this.value==='manager'?'block':'none'"><option value="assessor">Assessor</option><option value="manager">Nurse Manager</option></select><div id="mc" style="display:none"><label>Manager registration code</label><div class="pw"><input id="mcode" type="password"><button type="button" class="s" onclick="tp('mcode',this)">Show</button></div></div>`:""}
  <label>Username</label><input id="un" autocapitalize="none" placeholder="Username"><label>Password (min 6 characters)</label><div class="pw"><input id="pw" type="password" placeholder="Password"><button type="button" class="s" onclick="tp('pw',this)">Show</button></div>
  <button class="cta" onclick="${L?"login()":"register()"}">${L?"LOGIN":"REGISTER"}</button>
  <p class="sw">${L?"Don't have an account? ":"Already registered? "}<a onclick="mode='${L?"reg":"login"}';renderAuth()">${L?"Sign up":"Back to login"}</a></p></div></div>`;
}
function tp(id,b){const i=$(id),h=i.type==="password";i.type=h?"text":"password";b.textContent=h?"Hide":"Show"}
const mail=u=>u.trim().toLowerCase().replace(/[^a-z0-9._-]/g,"")+"@swmh-app.com";
async function login(){
  try{await auth.signInWithEmailAndPassword(mail($("un").value),$("pw").value)}
  catch(e){toast(e.code==="auth/network-request-failed"?"No internet connection":"Wrong username or password")}
}
async function register(){
  const name=$("nm").value.trim(),un=$("un").value.trim(),pw=$("pw").value,role=$("rl").value;
  if(!name||!un||pw.length<6)return toast("Enter name, username and a password of 6+ characters");
  registering=true;
  try{
    const c=await auth.createUserWithEmailAndPassword(mail(un),pw);
    const doc={name,username:un.toLowerCase(),role,createdAt:new Date().toISOString()};
    if(role==="manager")doc.managerCode=$("mcode").value;
    try{await db.collection("users").doc(c.user.uid).set(doc)}
    catch(e){await c.user.delete();throw{code:"bad-code"}}
    registering=false;toast("Account created");
    me={uid:c.user.uid,...doc};delete me.managerCode;screen=role==="manager"?"dash":"home";listen();render();
  }catch(e){registering=false;
    toast(e.code==="bad-code"?"Wrong manager code":e.code==="auth/email-already-in-use"?"Username already taken":e.code==="auth/network-request-failed"?"No internet connection":"Registration failed: "+(e.code||e.message))}
}

  return`<div class="card"><h2>Users</h2><p class="m">Deactivating a user blocks login and new submissions. Past assessments are kept, and you can reactivate at any time.</p><div class="wrap"><table><tr><th>Name</th><th>Username</th><th>Role</th><th>Assessments</th><th>Status</th><th></th></tr>${users.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.username)}</td><td>${esc(u.role)}</td><td>${c[u.id]||0}</td><td>${u.active===false?'<span class="p r">Deactivated</span>':'<span class="p g">Active</span>'}</td><td>${u.id===me.uid?"(you)":`<button class="s" onclick="setActive('${u.id}',${u.active===false})">${u.active===false?"Reactivate":"Deactivate"}</button>`}</td></tr>`).join("")}</table></div>
<h3>Forgotten password</h3><p>Passwords can't be reset from inside the app on the free Firebase plan. Open Firebase → Authentication → Users, delete that person's account, then ask them to register again with the same username.</p></div>`}
function setActive(id,v){if(!confirm(v?"Reactivate this user?":"Deactivate this user? They will no longer be able to log in."))return;db.collection("users").doc(id).update({active:v}).catch(e=>toast("Failed: "+e.code))}
function account(){const f=(i,l)=>`<label>${l}</label><div class="pw"><input id="${i}" type="password"><button type="button" class="s" onclick="tp('${i}',this)">Show</button></div>`;
  return`<div class="card"><h2>My Account</h2><p><b>${esc(me.name)}</b> (${esc(me.username)}), ${esc(me.role)}</p><h3>Change password</h3>${f("op","Current password")}${f("np","New password (min 6 characters)")}<button onclick="changePw()">Change password</button><hr style="border:0;border-top:1px solid #e3efe8;margin:16px 0"><button class="s" onclick="logout()">🚪 Logout</button></div>`}
async function changePw(){const o=$("op").value,n=$("np").value;if(n.length<6)return toast("New password must be 6+ characters");try{const u=auth.currentUser;await u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(u.email,o));await u.updatePassword(n);$("op").value=$("np").value="";toast("Password changed")}catch(e){toast(/wrong-password|invalid-credential/.test(e.code)?"Current password is wrong":"Failed: "+(e.code||e.message))}}

if(!auth&&!firebaseConfig.apiKey.startsWith("PASTE"))renderAuth();
</script></body></html>
