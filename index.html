<script>
// ====== STEP 1: PASTE YOUR NEW FIREBASE CONFIG HERE ======
const firebaseConfig={apiKey:"AIzaSyAvQZqFHaZfnXW780Nlr2S22e3Q2-rEcqI",authDomain:"swmh-monitoring.firebaseapp.com",projectId:"swmh-monitoring",storageBucket:"swmh-monitoring.firebasestorage.app",messagingSenderId:"729789344941",appId:"1:729789344941:web:ff66e4b744fa875f7d6a24"};
// Must match the code inside your Firestore rules. Change it before sharing.
const MANAGER_CODE="SWMH-MANAGER-2026";
// =========================================================
const units=["FW","MW","MAT","LAB","NICU","PACU","A&E","ANC","WELLNESS","RCH","PNC","MH","EYE","SC UNIT","THEATRE","OPD","KW","VCT"];
const sections=[["Attendance",["Check and compare duty roster with staff present"]],["Appearance",["Prescribed uniform, apron, cap/scrub"]],["Balanced Daily Ward State",["Balanced daily ward state maintained"]],["Preparation for Ward Rounds",["Ward round trolley properly set","Patient files arranged","Change book updated"]],["Documentation",["Admission notes complete","Care plan written for all admitted patients","Care plan reviewed per shift","Emergency drug book","Laundry book","Hardcopy/manuscript documentation completed appropriately","GHIMS documentation completed after manuscript/hardcopy documentation","GHIMS entry corresponds with the hardcopy/manuscript record"]],["Assignment Book Utilization",["Assignment book utilized appropriately"]],["Ward Environment",["Beds well-arranged and clean","Floor clean and dry","Waste segregation practiced correctly","Equipment arranged properly"]],["Equipment & Supplies",["Oxygen supply functional","Suction machine working","Adequate gloves and consumables"]],["Infection Prevention and Control (IPC)",["Decontamination solution changed appropriately according to schedule/procedure","Demonstration of proper handwashing technique","Correct use of personal protective equipment (PPE)","Hand hygiene observed at appropriate moments of patient care"]]];
const meanings=["Unacceptable — Immediate corrective action needed","Fairly Satisfactory — Below standard","Satisfactory — Meets minimum standard","Good — Above average compliance","Very Good — High standard maintained","Excellent — Outstanding practice"];
const N=sections.reduce((a,s)=>a+s[1].length,0);
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let auth,db,me=null,mine=[],all=[],unsub=null,draft={},screen="home",mode="login",registering=false,viewId=null,fUnit="";
function toast(t){const e=$("toast");e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",4500)}
function net(){$("st").textContent=navigator.onLine?"● Online":"● Offline — assessments are saved on this device and upload automatically"}
addEventListener("online",net);addEventListener("offline",net);net();
const cls=p=>p>=80?"g":p>=60?"a":"r";
const pill=p=>`<span class="p ${cls(p)}">${(+p).toFixed(1)}%</span>`;
const fmt=d=>new Date(d).toLocaleString();
const today=d=>new Date(d).toDateString()===new Date().toDateString();

if(firebaseConfig.apiKey.startsWith("PASTE")){
  $("app").innerHTML='<div class="card"><h2>Setup needed</h2><p>Open this file in a text editor and paste your Firebase config at the top of the script (STEP 1).</p></div>';
}else{
  firebase.initializeApp(firebaseConfig);auth=firebase.auth();db=firebase.firestore();
  db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
  auth.onAuthStateChanged(async u=>{
    if(registering)return;
    if(!u){me=null;if(unsub)unsub();return renderAuth()}
    try{const d=await db.collection("users").doc(u.uid).get();
      if(!d.exists){await auth.signOut();return renderAuth()}
      me={uid:u.uid,...d.data()};screen=me.role==="manager"?"dash":"home";listen();render();
    }catch(e){toast("Could not load your profile: "+(e.code||e.message));renderAuth()}
  });
}
function renderAuth(){
  $("app").innerHTML=`<div class="card"><h2>${mode==="login"?"Login":"Create Account"}</h2>
  ${mode==="reg"?`<label>Full name</label><input id="nm"><label>Role</label><select id="rl" onchange="$('mc').style.display=this.value==='manager'?'block':'none'"><option value="assessor">Assessor</option><option value="manager">Nurse Manager</option></select><div id="mc" style="display:none"><label>Manager registration code</label><input id="mcode" type="password"></div>`:""}
  <label>Username</label><input id="un" autocapitalize="none"><label>Password (min 6 characters)</label><input id="pw" type="password">
  <button onclick="${mode==="login"?"login()":"register()"}">${mode==="login"?"Login":"Register"}</button>
  <button class="s" onclick="mode='${mode==="login"?"reg":"login"}';renderAuth()">${mode==="login"?"Create an account":"Back to login"}</button></div>`;
}
const mail=u=>u.trim().toLowerCase().replace(/[^a-z0-9._-]/g,"")+"@swmh-app.com";
async function login(){
  try{await auth.signInWithEmailAndPassword(mail($("un").value),$("pw").value)}
  catch(e){toast(e.code==="auth/network-request-failed"?"No internet connection":"Wrong username or password")}
}
async function register(){
  const name=$("nm").value.trim(),un=$("un").value.trim(),pw=$("pw").value,role=$("rl").value;
  if(!name||!un||pw.length<6)return toast("Enter name, username and a password of 6+ characters");
  registering=true;
  try{
    const c=await auth.createUserWithEmailAndPassword(mail(un),pw);
    const doc={name,username:un.toLowerCase(),role,createdAt:new Date().toISOString()};
    if(role==="manager")doc.managerCode=$("mcode").value;
    try{await db.collection("users").doc(c.user.uid).set(doc)}
    catch(e){await c.user.delete();throw{code:"bad-code"}}
    registering=false;toast("Account created");
    me={uid:c.user.uid,...doc};delete me.managerCode;screen=role==="manager"?"dash":"home";listen();render();
  }catch(e){registering=false;
    toast(e.code==="bad-code"?"Wrong manager code":e.code==="auth/email-already-in-use"?"Username already taken":e.code==="auth/network-request-failed"?"No internet connection":"Registration failed: "+(e.code||e.message))}
}
function listen(){
  if(unsub)unsub();const c=db.collection("assessments");
  if(me.role==="manager")unsub=c.orderBy("date","desc").limit(1000).onSnapshot(s=>{all=s.docs.map(d=>({...d.data(),id:d.id}));refresh()},e=>toast("Cannot load records: "+e.code));
  else unsub=c.where("assessorUid","==",me.uid).onSnapshot({includeMetadataChanges:true},s=>{mine=s.docs.map(d=>({...d.data(),id:d.id,pending:d.metadata.hasPendingWrites}));mine.sort((a,b)=>b.date.localeCompare(a.date));refresh()},e=>toast("Cannot load records: "+e.code));
}
function refresh(){if(me&&screen!=="new")render()}
function go(s,id){screen=s;viewId=id||null;render();scrollTo(0,0)}
function logout(){if(unsub)unsub();auth.signOut()}
function render(){
  const m=me.role==="manager";
  const tabs=m?[["dash","Dashboard"],["records","All Records"]]:[["home","Home"],["new","New Assessment"],["history","My History"]];
  let h=`<div class="nav">${tabs.map(t=>`<button class="${screen===t[0]?"on":""}" onclick="go('${t[0]}')">${t[1]}</button>`).join("")}<button onclick="logout()">Logout</button></div>`;
  h+=({home,new:newForm,history,dash,records,detail}[screen]||home)();
  $("app").innerHTML=h;
}
function home(){const p=mine.filter(x=>x.pending).length;
  return`<div class="card"><h2>Welcome, ${esc(me.name)}</h2><div class="grid"><div class="stat">My submissions<b>${mine.length}</b></div><div class="stat">Pending upload<b>${p}</b></div><div class="stat">Units<b>${units.length}</b></div></div><p><button onclick="go('new')">Start New Assessment</button><button class="s" onclick="go('history')">View History</button></p></div>`}
function newForm(){
  if(!draft.scores)draft={scores:{}};
  let h=`<div class="card"><h2>New Daily Assessment</h2><label>Unit/Ward</label><select id="unit"><option value="">Select unit/ward</option>${units.map(u=>`<option>${esc(u)}</option>`).join("")}</select><label>Shift</label><select id="shift"><option value="">Select shift</option><option>Morning Shift</option><option>Afternoon Shift</option></select>`;
  sections.forEach((s,i)=>{h+=`<h3>${i+1}. ${esc(s[0])}</h3>`;s[1].forEach((t,j)=>{const k=i+"-"+j;h+=`<div class="item"><b>${esc(t)}</b><div class="sc">${[0,1,2,3,4,5].map(n=>`<button id="b${k}_${n}" onclick="sc('${k}',${n})">${n}</button>`).join("")}</div><span class="m" id="m${k}">Select a score</span></div>`})});
  return h+`<label>Overall observations / corrective action notes</label><textarea id="cm"></textarea><label>Evidence reference (optional)</label><textarea id="ev"></textarea><button onclick="submit()">Submit Assessment</button><button class="s" onclick="draft={};go('home')">Cancel</button></div>`;
}
function sc(k,n){draft.scores[k]=n;for(let i=0;i<6;i++)$("b"+k+"_"+i).classList.toggle("sel",i===n);$("m"+k).textContent=n+" — "+meanings[n]}
function submit(){
  const unit=$("unit").value,shift=$("shift").value;
  if(!unit)return toast("Select a unit/ward");if(!shift)return toast("Select a shift");
  if(Object.keys(draft.scores).length<N)return toast("Score every indicator before submitting");
  const total=Object.values(draft.scores).reduce((a,b)=>a+b,0);
  const x={unit,shift,assessorUid:me.uid,assessorName:me.name,date:new Date().toISOString(),scores:draft.scores,total,max:N*5,average:+(total/N).toFixed(2),percentage:+(total/(N*5)*100).toFixed(1),comments:$("cm").value,evidence:$("ev").value};
  db.collection("assessments").doc().set(x).catch(e=>toast("Upload failed: "+e.code));
  draft={};toast(navigator.onLine?"Assessment submitted":"Saved on this device. It will upload when internet returns.");go("history");
}
function tbl(a,showWho){
  return a.length?`<div class="wrap"><table><tr><th>Date</th>${showWho?"<th>Assessor</th>":""}<th>Unit</th><th>Shift</th><th>Avg</th><th>%</th><th>Status</th><th></th></tr>${a.map(x=>`<tr><td>${fmt(x.date)}</td>${showWho?`<td>${esc(x.assessorName)}</td>`:""}<td>${esc(x.unit)}</td><td>${esc(x.shift)}</td><td>${x.average}</td><td>${pill(x.percentage)}</td><td>${x.pending?'<span class="p pend">Pending</span>':'<span class="p g">Synced</span>'}</td><td><button class="s" onclick="go('detail','${x.id}')">View</button></td></tr>`).join("")}</table></div>`:"<p>No assessments yet.</p>";
}
function history(){return`<div class="card"><h2>My Assessment History</h2>${tbl(mine,false)}</div>`}
function dash(){
  const n=all.length,avg=n?all.reduce((a,x)=>a+x.percentage,0)/n:0,td=all.filter(x=>today(x.date));
  const done=new Set(td.map(x=>x.unit)),miss=units.filter(u=>!done.has(u));
  const rows=units.map(u=>{const a=all.filter(x=>x.unit===u);return{u,c:a.length,p:a.length?a.reduce((s,x)=>s+x.percentage,0)/a.length:null,l:a[0]?fmt(a[0].date):"—"}});
  return`<div class="card"><h2>Nurse Manager Dashboard</h2><div class="grid"><div class="stat">Total assessments<b>${n}</b></div><div class="stat">Average score<b>${avg.toFixed(1)}%</b></div><div class="stat">Assessed today<b>${done.size}/${units.length}</b></div><div class="stat">Below 60%<b>${all.filter(x=>x.percentage<60).length}</b></div></div>
  <h3>Units not yet assessed today</h3><p>${miss.length?miss.map(esc).join(", "):"All units assessed ✔"}</p>
  <h3>Performance by unit</h3><div class="wrap"><table><tr><th>Unit</th><th>Assessments</th><th>Average</th><th>Latest</th></tr>${rows.map(r=>`<tr><td>${esc(r.u)}</td><td>${r.c}</td><td>${r.p===null?"—":pill(r.p)}</td><td>${r.l}</td></tr>`).join("")}</table></div>
  <h3>Recent submissions</h3>${tbl(all.slice(0,10),true)}</div>`;
}
function records(){
  const a=fUnit?all.filter(x=>x.unit===fUnit):all;
  return`<div class="card"><h2>All Records</h2><select onchange="fUnit=this.value;render()"><option value="">All units</option>${units.map(u=>`<option ${u===fUnit?"selected":""}>${esc(u)}</option>`).join("")}</select><button onclick="csv()">Export CSV</button>${tbl(a,true)}</div>`;
}
function csv(){
  const L=["Date,Assessor,Unit,Shift,Total,Max,Average,Percentage,Comments"];
  all.forEach(x=>L.push([x.date,x.assessorName,x.unit,x.shift,x.total,x.max,x.average,x.percentage,JSON.stringify(x.comments||"")].map(v=>/[",\n]/.test(v)?'"'+String(v).replace(/"/g,'""')+'"':v).join(",")));
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([L.join("\n")],{type:"text/csv"}));a.download="SWMH_assessments.csv";a.click();
}
function detail(){
  const x=(me.role==="manager"?all:mine).find(r=>r.id===viewId);if(!x)return"<div class='card'>Record not found.</div>";
  let h=`<div class="card"><h2>Assessment Detail</h2><p><b>Unit:</b> ${esc(x.unit)} &nbsp;<b>Shift:</b> ${esc(x.shift)} &nbsp;<b>Assessor:</b> ${esc(x.assessorName)}<br><b>Date:</b> ${fmt(x.date)} &nbsp;<b>Score:</b> ${x.total}/${x.max} ${pill(x.percentage)}</p>`;
  sections.forEach((s,i)=>{h+=`<h3>${i+1}. ${esc(s[0])}</h3>`;s[1].forEach((t,j)=>{const v=x.scores[i+"-"+j];h+=`<div class="item">${esc(t)}<br><b>${v}</b> <span class="m">${meanings[v]||""}</span></div>`})});
  return h+`<h3>Observations</h3><p>${esc(x.comments)||"—"}</p><h3>Evidence</h3><p>${esc(x.evidence)||"—"}</p><button class="s" onclick="go('${me.role==="manager"?"records":"history"}')">Back</button></div>`;
}
if(!auth&&!firebaseConfig.apiKey.startsWith("PASTE"))renderAuth();
</script></body></html>
